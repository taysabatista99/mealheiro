<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mealheiro — Nova meta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="conteudo">
      <a href="index.html" class="voltar">← Minhas metas</a>
      <h1 id="titulo">Nova meta</h1>
      <p>Defina o objetivo e o prazo</p>
    </div>
  </header>

  <main>
    <form id="form-meta" novalidate>
      <label for="nome">Nome da meta</label>
      <input type="text" id="nome" maxlength="40" placeholder="Ex.: Viagem a Fortaleza">
      <p class="erro" id="erro-nome"></p>

      <label for="valor">Valor total (R$)</label>
      <input type="number" id="valor" min="0.01" step="0.01" placeholder="Ex.: 3000">
      <p class="erro" id="erro-valor"></p>

      <label for="prazo">Prazo</label>
      <input type="date" id="prazo">
      <p class="erro" id="erro-prazo"></p>

      <label for="categoria">Categoria</label>
      <select id="categoria">
        <option>Viagem</option>
        <option>Reserva de emergência</option>
        <option>Compra de um bem</option>
        <option>Estudos ou cursos</option>
        <option>Outro</option>
      </select>

      <!-- Prévia do valor mensal, atualizada enquanto a pessoa digita (US03) -->
      <div class="cartao destaque" id="previa" hidden>
        <span class="pequeno">Para chegar lá no prazo, guarde</span>
        <strong id="previa-valor"></strong>
        <span class="pequeno" id="previa-meses"></span>
      </div>

      <button type="submit" class="botao" style="margin-top:18px">Salvar meta</button>
      <a href="index.html" class="botao-secundario" id="cancelar">Cancelar</a>
    </form>
  </main>

  <script src="js/dados.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/nova-meta.js"></script>
</body>
</html>
